const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw,remember){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  if(remember)try{localStorage.setItem('homerst-pw',pw)}catch(e){}
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),e=document.getElementById('e');
f.onsubmit=async ev=>{ev.preventDefault();e.textContent='Opening…';try{await open(document.getElementById('p').value,true)}catch(x){e.textContent='Wrong password.'}};
(async()=>{let pw=null;const h=location.hash.match(/pw=([^&]+)/);if(h)pw=decodeURIComponent(h[1]);else try{pw=localStorage.getItem('homerst-pw')}catch(x){}
 if(pw)try{await open(pw,!h)}catch(x){try{localStorage.removeItem('homerst-pw')}catch(y){}}})();
